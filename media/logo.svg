    <circle cx="286" cy="196" r="15"/><rect x="268" y="214" width="36" height="30" rx="14"/>
  </g>
  <!-- sync arrow from the bottom layer up to the top -->
  <path d="M398 400 C 470 360, 470 250, 418 196" fill="none" stroke="#a8ffe8" stroke-width="16" stroke-linecap="round"/>
  <path d="M392 168 L446 184 L410 226 Z" fill="#a8ffe8"/>
