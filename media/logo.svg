  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <!-- lower layers -->
  <path d="M236 318 L386 388 L236 458 L86 388 Z" fill="#1c3e4c" stroke="#2c5f6e" stroke-width="4"/>
